<!doctype html><html lang="en"><head><meta charset="utf-8"><title>History</title><link rel="stylesheet" href="swiftnet://history/page.css"></head>
<body><div class="top"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff" fill-opacity=".25"/><circle cx="16" cy="16" r="12" fill="#2a8fd8"/><path d="M5 19 C 11 13, 18 12, 28 9 C 21 14, 16 18, 9 26 C 10 22, 9 20, 5 19 Z" fill="#fff"/></svg><h1>History</h1><input type="search" id="q" placeholder="Search history"></div>
<main><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="clear">Clear all history</button></div><div id="list"></div></main>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"\x27]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]})}
sn.get("settings").then(function(r){document.body.classList.toggle("modern",r.settings.theme==="modern")});
</script>
<script>
function load(){sn.get("history",document.getElementById("q").value).then(function(list){
  var box=document.getElementById("list");
  if(!list.length){box.innerHTML='<div class="empty">No history yet.</div>';return}
  var html="",day="";
  list.forEach(function(h,i){var d=new Date(h.time);var label=d.toDateString()===new Date().toDateString()?"Today":d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    if(label!==day){if(day)html+="</div>";html+='<div class="day">'+label+'</div><div class="card">';day=label}
    var host="";try{host=new URL(h.url).hostname}catch(e){}
    html+='<div class="row"><span class="time">'+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</span><a class="grow" href="'+esc(h.url)+'"><div class="title">'+esc(h.title)+'</div><div class="url">'+esc(h.url)+'</div></a><button class="icon-btn" data-i="'+i+'" title="Remove from history">&#10005;</button></div>'});
  box.innerHTML=html+"</div>";box._list=list})}
document.getElementById("q").addEventListener("input",load);
document.getElementById("list").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;var h=this._list[+b.getAttribute("data-i")];sn.set("removeHistory",{url:h.url,time:h.time}).then(load)});
document.getElementById("clear").addEventListener("click",function(){if(confirm("Clear all browsing history?"))sn.set("clearHistory").then(load)});
load();
</script></body></html>
