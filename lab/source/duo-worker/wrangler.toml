name = "stick-hubs-server"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Messages per person per day. The owner pass has no limit.
DAILY_LIMIT = "10"
# Messages per day for everyone together (keeps your Anthropic bill in check).
GLOBAL_DAILY_LIMIT = "200"
# Projects one person can publish or update on the Game Hub per day.
PUBLISH_DAILY_LIMIT = "5"

# Create it with: npx wrangler kv namespace create DUO_KV
# then paste the id it prints here.
[[kv_namespaces]]
binding = "DUO_KV"
id = "PASTE_THE_KV_ID_HERE"
