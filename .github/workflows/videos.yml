name: Update Stick Manx TV videos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/videos.yml", "tools/fetch_videos.py"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_videos.py
      - name: Save new videos
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "stick-manx-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Update videos"
            git push
          fi
