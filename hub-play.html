<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hub · Stick Hubs</title>
<meta name="description" content="Play a game made in Stick Lab and published on the Stick Hubs Game Hub.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://stick-hubs.github.io/hub-play.html">
<meta property="og:title" content="Game Hub · Stick Hubs">
<meta property="og:description" content="Play a game made in Stick Lab and published on the Stick Hubs Game Hub.">
<meta property="og:image" content="https://stick-hubs.github.io/og-image.jpg">
<style>
html, body { margin: 0; height: 100%; background: #0f1d33; color: #fff; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: linear-gradient(180deg, #a3d2f7 0%, #62a7e8 46%, #2a6ab8 50%, #3283d6 100%); border-bottom: 1px solid #1b4f8f; }
.bar a.back, .bar button { font: bold 13px system-ui, sans-serif; color: #1f3550; background: linear-gradient(180deg, #fff 0%, #edf3fa 49%, #dde8f5 50%, #e8f0f9 100%); border: 1px solid #1b4f8f; border-radius: 4px; padding: 4px 10px; cursor: pointer; text-decoration: none; }
.bar .title { font: bold 16px "Trebuchet MS", "Segoe UI", sans-serif; text-shadow: 0 1px 1px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .tip { margin-left: auto; font-size: 12px; opacity: .95; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.msg { margin: 40px auto; max-width: 520px; text-align: center; font-size: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bar"><a class="back" href="games.html#community">&larr; Game Hub</a><span class="title" id="title">Game Hub</span><button id="about-btn" hidden>About</button><span class="tip">Made in Stick Lab</span></div>
<iframe id="game" title="Game Hub" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

<script>
// ----- Game Hub: which project, its title, and the About / Report / Remove buttons -----
window.hubReady = (async function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  if (!/^[a-z0-9]{4,20}$/.test(id)) throw new Error('This link is missing the project. Go back to the Game Hub and pick a game.');
  var config = await fetch('lab/duo-config.json', {cache: 'no-cache'}).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
  if (!config.serverUrl) throw new Error('The Game Hub isn\'t switched on yet.');
  return {id: id, server: config.serverUrl.replace(/\/$/, '')};
})();
window.hubReady.catch(function () {});
(function () {
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function readJson(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
  window.hubReady.then(function (hub) {
    fetch(hub.server + '/hub/info/' + hub.id).then(function (r) { return r.ok ? r.json() : null; }).then(function (body) {
      if (!body || !body.project) return;
      var p = body.project;
      window.HUB_TITLE = p.title;
      document.title = p.title + ' · Game Hub · Stick Hubs';
      document.getElementById('title').textContent = p.title;
      var mine = (readJson('stick-hub-my-projects') || {})[p.id];
      var settings = readJson('stick-lab-duo-settings') || {};
      var panel = el('div', 'hub-about'); panel.hidden = true;
      panel.appendChild(el('b', null, p.title));
      var by = el('div', 'hub-by', 'by ');
      if (p.ownerLogin) { var who = el('a', null, p.author); who.href = 'profile.html?u=' + encodeURIComponent(p.ownerLogin); who.style.color = 'inherit'; by.appendChild(who); }
      else by.appendChild(document.createTextNode(p.author));
      by.appendChild(document.createTextNode(' · ' + new Date(p.updated || p.created).toLocaleDateString()));
      panel.appendChild(by);
      if (p.description) panel.appendChild(el('p', null, p.description));
      var row = el('div', 'hub-row');
      var open = el('a', 'hub-btn', 'Open in Stick Lab');
      open.href = 'lab/?project_url=' + encodeURIComponent(hub.server + '/hub/file/' + p.id);
      row.appendChild(open);
      var report = el('button', 'hub-btn', 'Report');
      report.onclick = function () {
        if (!confirm('Report this project? Tell us it isn\'t OK for the Game Hub (mean, scary, or not for kids). After a few reports it is hidden until akami checks it.')) return;
        fetch(hub.server + '/hub/report', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: p.id})})
          .then(function () { report.textContent = 'Reported. Thank you!'; report.disabled = true; });
      };
      row.appendChild(report);
      var acct = null; try { acct = JSON.parse(localStorage.getItem('stick-hubs-account') || 'null'); } catch (e) {}
      var session = null; try { session = localStorage.getItem('stick-hubs-session'); } catch (e) {}
      var myAccount = acct && session && p.ownerLogin && acct.login.toLowerCase() === p.ownerLogin.toLowerCase();
      if ((mine && mine.editKey) || settings.ownerPass || myAccount) {
        var del = el('button', 'hub-btn hub-del', 'Remove from the Game Hub');
        del.onclick = function () {
          if (!confirm('Remove "' + p.title + '" from the Game Hub? This can\'t be undone.')) return;
          var headers = {'content-type': 'application/json'};
          if (settings.ownerPass) headers['x-duo-owner'] = settings.ownerPass;
          if (session) headers.authorization = 'Bearer ' + session;
          fetch(hub.server + '/hub/delete', {method: 'POST', headers: headers, body: JSON.stringify({id: p.id, editKey: mine && mine.editKey})})
            .then(function (r) { return r.json(); }).then(function (b) {
              if (b.ok) location.href = 'games.html#community'; else alert(b.error || 'Could not remove it.');
            });
        };
        row.appendChild(del);
      }
      panel.appendChild(row);
      document.body.appendChild(panel);
      var b = document.getElementById('about-btn'); b.hidden = false;
      b.onclick = function () { panel.hidden = !panel.hidden; };
    });
  }).catch(function () {});
})();
</script>
<style>
.hub-about-btn{margin-left:8px;font:bold 13px system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#9fd0f7 0%,#5ea6e8 45%,#2a6ab8 50%,#3a87d6 100%);border:1px solid #1b4f8f;border-radius:4px;padding:4px 10px;cursor:pointer}
.hub-about{position:fixed;top:52px;left:10px;z-index:50;width:min(360px,calc(100vw - 20px));background:#f5f8fc;color:#1f3550;border:1px solid #1b4f8f;border-radius:6px;box-shadow:0 8px 28px #0006;padding:12px 14px;font:14px/1.45 system-ui,sans-serif}
.hub-about b{font-size:17px}
.hub-about p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.hub-by{color:#5a6f88;font-size:12px;margin-top:2px}
.hub-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hub-btn{font:bold 13px system-ui,sans-serif;color:#1f3550;background:linear-gradient(180deg,#fff 0%,#edf3fa 49%,#dde8f5 50%,#e8f0f9 100%);border:1px solid #9db4cf;border-radius:4px;padding:5px 10px;cursor:pointer;text-decoration:none}
.hub-del{color:#8a1f1f;border-color:#e0a3a3}
</style>

<script>
(function () {
  var frame = document.getElementById('game');
  function play(url) {
    frame.src = 'lab/embed.html?autoplay&project_url=' + encodeURIComponent(url);
    frame.addEventListener('load', function () { try { frame.focus(); } catch (e) {} });
  }
  window.playInLab = play;
  window.hubReady.then(function (hub) {
      return fetch(hub.server + '/hub/info/' + hub.id).then(function (r) {
        if (!r.ok) throw new Error('This project isn\'t on the Game Hub any more.');
        play(hub.server + '/hub/file/' + hub.id);
      });
    })
    .catch(function (e) { frame.remove(); var d = document.createElement('p'); d.className = 'msg'; d.textContent = e.message; document.body.appendChild(d); });
})();
</script>
</body>
</html>
