<body>
<div class="menubar">
  <a href="games.html" title="Back to the Game Hub">&larr; Game Hub</a>
  <b>Stick Physics Classic</b>
  <span class="muted">a physics playground</span>
  <span class="right">
    <label>Scene <select id="scene">
      <option value="empty">Empty</option>
      <option value="cradle">Newton's cradle</option>
      <option value="catapult">Catapult</option>
      <option value="car">Motor car</option>

</div>
<div class="desk">
  <div class="win tools">
    <div class="title"><span>Tools</span></div>
    <div class="toolgrid" id="tools"></div>
  </div>
  <div class="win stagewin">
    <div class="title"><span id="wintitle">Untitled World</span></div>
    <div class="stagewrap" id="wrap"><canvas id="world" width="1200" height="700"></canvas><div class="hint" id="hint"></div></div>
    <div class="controls">
      <button class="btn run" id="run">&#9654; Run</button>
      <button class="btn" id="step" title="Move forward one moment">Step</button>

      <span class="sep"></span>
      <label>Gravity <select id="gravity">
        <option value="1">Earth</option><option value="0.165">Moon</option><option value="0.38">Mars</option>
        <option value="2.53">Jupiter</option><option value="0">None</option>
      </select></label>
      <label class="chk"><input type="checkbox" id="air"> Air</label>
      <label class="chk"><input type="checkbox" id="slow"> Slow-mo</label>
      <label class="chk"><input type="checkbox" id="vectors" checked> Arrows</label>
      <label class="chk"><input type="checkbox" id="grid" checked> Grid</label>

    </div>
  </div>
  <div class="side">
    <div class="win" style="flex:0 0 auto">
      <div class="title"><span>Object</span></div>
      <div class="panel" id="inspector"><p class="muted">Click something with the Hand to see its numbers and change it.</p></div>
    </div>
    <div class="win" style="flex:1;min-height:150px">
      <div class="title"><span>Speed graph</span></div>
      <div class="panel"><canvas id="graph" width="440" height="180"></canvas><p class="muted" id="graphnote">Pick an object, then press Run.</p></div>
    </div>
  </div>
</div>
<script src="physics/matter.min.js"></script>
<script>
(function () {
'use strict';
const {Engine, Body, Bodies, Composite, Constraint, Query, Vertices, Vector, Events} = Matter;
const W = 1200, H = 700;
const PX_PER_M = 50; // 50 pixels = 1 metre
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const engine = Engine.create();
engine.positionIterations = 8;
engine.velocityIterations = 6;
engine.constraintIterations = 3;
const world = engine.world;

const COLORS = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#6d4c41', '#9e9e9e', '#ffffff', '#222222'];
let running = false, time = 0, selected = null, snapshot = null, groupCounter = 1;
const graph = [];

// ------------------------------------------------------------------ making things
function meta(body) { if (!body.plugin.sp) body.plugin.sp = {color: '#1e88e5', trail: []}; return body.plugin.sp; }
function add(body, opts) {
  const m = meta(body);
  Object.assign(m, opts || {});
  Composite.add(world, body);
  return body;
}
function ball(x, y, r, color, extra) {
  return add(Bodies.circle(x, y, r, Object.assign({restitution: 0.6, friction: 0.05, frictionAir: airValue()}, extra || {})), {kind: 'Ball', color: color || '#e53935'});
}
function box(x, y, w, h, color, extra) {
  return add(Bodies.rectangle(x, y, w, h, Object.assign({restitution: 0.2, friction: 0.5, frictionAir: airValue()}, extra || {})), {kind: 'Box', color: color || '#1e88e5'});
}
function ramp(x1, y1, x2, y2, color, extra) {
  // a right triangle from a dragged box: slope goes down toward the drag end
  const left = Math.min(x1, x2), right = Math.max(x1, x2), top = Math.min(y1, y2), bottom = Math.max(y1, y2);
  const highOnLeft = x2 > x1;
  const pts = highOnLeft ? [{x: left, y: top}, {x: right, y: bottom}, {x: left, y: bottom}] : [{x: right, y: top}, {x: right, y: bottom}, {x: left, y: bottom}];
  const c = Vertices.centre(pts);
  const body = Bodies.fromVertices(c.x, c.y, [pts], Object.assign({isStatic: true, friction: 0.3, restitution: 0.1}, extra || {}));
  return add(body, {kind: 'Ramp', color: color || '#6d4c41'});
}
function link(type, bodyA, pointA, bodyB, pointB, opts) {
  const o = {bodyA: bodyA || undefined, bodyB: bodyB || undefined, damping: 0.05};
  o.pointA = bodyA ? Vector.sub(pointA, bodyA.position) : {x: pointA.x, y: pointA.y};
  o.pointB = bodyB ? Vector.sub(pointB, bodyB.position) : {x: pointB.x, y: pointB.y};
  if (type === 'spring') { o.stiffness = 0.012; o.damping = 0.02; }
  if (type === 'rod') { o.stiffness = 1; }
  if (type === 'pin') { o.stiffness = 1; o.length = 0; o.damping = 0.1; }
  if (type === 'joint') { o.stiffness = 0.9; o.length = 0; o.damping = 0.1; }
  Object.assign(o, opts || {});
  const c = Constraint.create(o);
  c.plugin = {sp: {type}};
  Composite.add(world, c);
  return c;
}
// A ragdoll stickman standing with its feet at (x, y).
function ragdoll(x, y, color, s) {
  s = s || 1; color = color || '#222222';
  const group = Body.nextGroup(true), id = 'rag' + (groupCounter++);
  const o = {collisionFilter: {group}, friction: 0.6, restitution: 0.1, frictionAir: Math.max(0.01, airValue())};
  const P = (dx, dy) => ({x: x + dx * s, y: y + dy * s});
  const part = (body, name) => add(body, {kind: 'Ragdoll', part: name, color, group: id});
  // a stick from point a to point b (as a thin box turned to point the right way)
  const stick = (a, b, width, name) => {
    const A = P(a[0], a[1]), B = P(b[0], b[1]);
    const len = Math.hypot(B.x - A.x, B.y - A.y);
    return part(Bodies.rectangle((A.x + B.x) / 2, (A.y + B.y) / 2, width * s, len + width * s * 0.6,
      Object.assign({angle: Math.atan2(-(B.x - A.x), B.y - A.y)}, o)), name);
  };
  const J = {neck: [0, -100], hip: [0, -54], elbowL: [-14, -78], handL: [-24, -58], elbowR: [14, -78], handR: [24, -58],
    kneeL: [-8, -27], footL: [-13, 0], kneeR: [8, -27], footR: [13, 0]};
  const head = part(Bodies.circle(P(0, -114).x, P(0, -114).y, 13 * s, o), 'head');
  const torso = stick(J.neck, J.hip, 8, 'torso');
  const uaL = stick(J.neck, J.elbowL, 6, 'arm'), laL = stick(J.elbowL, J.handL, 6, 'arm');
  const uaR = stick(J.neck, J.elbowR, 6, 'arm'), laR = stick(J.elbowR, J.handR, 6, 'arm');
  const thL = stick(J.hip, J.kneeL, 7, 'leg'), shL = stick(J.kneeL, J.footL, 7, 'leg');
  const thR = stick(J.hip, J.kneeR, 7, 'leg'), shR = stick(J.kneeR, J.footR, 7, 'leg');
  const j = (a, b, pt) => { const p = P(pt[0], pt[1]); link('joint', a, p, b, p); };
  j(head, torso, J.neck); j(head, torso, [0, -104]);
  j(torso, uaL, J.neck); j(uaL, laL, J.elbowL);
  j(torso, uaR, J.neck); j(uaR, laR, J.elbowR);
  j(torso, thL, J.hip); j(thL, shL, J.kneeL);
  j(torso, thR, J.hip); j(thR, shR, J.kneeR);
  return torso;
}
function airValue() { return document.getElementById('air').checked ? 0.02 : 0; }

function groupOf(body) {
  const g = meta(body).group;
  return g ? Composite.allBodies(world).filter(b => meta(b).group === g) : [body];
}
function removeBody(body) {
  for (const b of groupOf(body)) {
    for (const c of Composite.allConstraints(world)) if (c.bodyA === b || c.bodyB === b) Composite.remove(world, c);
    Composite.remove(world, b);
    if (selected === b) select(null);
  }
}

// The ground and walls are always there.
function addBounds() {
  add(Bodies.rectangle(W / 2, H + 30, W * 3, 100, {isStatic: true, friction: 0.8}), {kind: 'Ground', color: '#bbbbbb', fixedWorld: true});
  add(Bodies.rectangle(-30, H / 2, 60, H * 3, {isStatic: true}), {kind: 'Wall', color: '#bbbbbb', fixedWorld: true, hidden: true});
  add(Bodies.rectangle(W + 30, H / 2, 60, H * 3, {isStatic: true}), {kind: 'Wall', color: '#bbbbbb', fixedWorld: true, hidden: true});
}

// ------------------------------------------------------------------ scenes
const SCENES = {
  empty () {},
  cradle () {
    const n = 5, r = 26, top = 150;
    box(600, top - 10, 360, 20, '#6d4c41', {isStatic: true});
    for (let i = 0; i < n; i++) {
      const x = 600 - (n - 1) * r + i * 2 * r;
      const b = ball(i === 0 ? x - 220 : x, i === 0 ? top + 120 : top + 260, r, '#9e9e9e', {restitution: 1, friction: 0, frictionAir: 0, inertia: Infinity, slop: 0.5});
      link('rod', null, {x, y: top}, b, b.position);
    }
  },
  catapult () {
    box(560, 640, 40, 120, '#6d4c41', {isStatic: true});
    const arm = box(560, 572, 460, 18, '#fdd835', {density: 0.004, friction: 1});
    link('pin', null, {x: 560, y: 572}, arm, {x: 560, y: 572});
    ball(370, 540, 22, '#e53935', {density: 0.0006});
    box(735, 300, 70, 70, '#222222', {density: 0.03, friction: 1});
    ragdoll(1030, 700);
  },
  car () {
    ramp(1200, 520, 500, 700, '#6d4c41');
    const id = 'car' + (groupCounter++);
    const group = Body.nextGroup(true);
    const body = box(220, 615, 190, 34, '#e53935', {collisionFilter: {group}, density: 0.003});
    meta(body).group = id; meta(body).kind = 'Car';
    const w1 = ball(150, 640, 30, '#222222', {collisionFilter: {group}, friction: 0.95, restitution: 0.05, density: 0.004});
    const w2 = ball(290, 640, 30, '#222222', {collisionFilter: {group}, friction: 0.95, restitution: 0.05, density: 0.004});
    for (const w of [w1, w2]) { meta(w).group = id; meta(w).kind = 'Wheel'; meta(w).motor = 0.09; }
    link('pin', body, {x: 150, y: 640}, w1, {x: 150, y: 640}, {stiffness: 0.5});
    link('pin', body, {x: 290, y: 640}, w2, {x: 290, y: 640}, {stiffness: 0.5});
    for (let i = 0; i < 5; i++) box(1130, 515 - i * 41, 40, 40, i % 2 ? '#fdd835' : '#1e88e5', {friction: 0.6});
  },
  stairs () {
    // steps going down to the left, tallest on the right
    for (let i = 0; i < 7; i++) {
      const h = (7 - i) * 55;
      box(W - 47.5 - i * 95, H - h / 2, 95, h, '#9e9e9e', {isStatic: true});
    }
    // the stickman leans over the edge of the top step, so it tumbles down
    const feet = {x: W - 92, y: H - 7 * 55};
    const torso = ragdoll(feet.x, feet.y);
    for (const b of groupOf(torso)) { Body.rotate(b, -0.35, feet); b.friction = 0.15; b.restitution = 0.3; meta(b).v0 = {x: -6.5, y: -5}; }
    ball(W - 40, 120, 24, '#e53935', {density: 0.004}).plugin.sp.v0 = {x: -5, y: 0};
  },
  dominoes () {
    ramp(40, 360, 380, 640, '#6d4c41');
    ball(80, 320, 26, '#e53935', {density: 0.004});
    for (let i = 0; i < 11; i++) box(470 + i * 62, 640, 16, 120, i % 2 ? '#fdd835' : '#1e88e5', {friction: 0.4, restitution: 0.05});
  },
  pendulum () {
    box(600, 60, 900, 16, '#6d4c41', {isStatic: true});
    const bob = ball(380, 240, 30, '#e53935', {restitution: 0.3});
    link('rod', null, {x: 260, y: 68}, bob, bob.position);
    const mass = box(800, 330, 70, 70, '#1e88e5');
    link('spring', null, {x: 800, y: 68}, mass, {x: 800, y: 300});
    const m2 = ball(980, 300, 24, '#43a047');
    link('spring', null, {x: 980, y: 68}, m2, m2.position, {length: 140});
  }
};

function loadScene(name) {
  stop();
  Composite.clear(world, false);
  select(null);
  snapshot = null; time = 0; graph.length = 0;
  addBounds();
  (SCENES[name] || SCENES.empty)();
  document.getElementById('wintitle').textContent = document.querySelector('#scene option[value="' + name + '"]').textContent;
  updateClock();
}

// ------------------------------------------------------------------ run / stop / reset
function takeSnapshot() {
  snapshot = Composite.allBodies(world).map(b => ({b, x: b.position.x, y: b.position.y, a: b.angle}));
}
function run() {
  if (!snapshot) {
    takeSnapshot();
    // scenes can give things a starting push
    for (const b of Composite.allBodies(world)) { const v = meta(b).v0; if (v) Body.setVelocity(b, v); }
  }
  running = true;
  document.getElementById('run').innerHTML = '&#10074;&#10074; Stop';
  document.getElementById('run').classList.add('on');
}
function stop() {
  running = false;
  const r = document.getElementById('run');
  if (r) { r.innerHTML = '&#9654; Run'; r.classList.remove('on'); }
}
function reset() {
  stop();
  if (snapshot) {
    const alive = new Set(Composite.allBodies(world));
    for (const s of snapshot) {
      if (!alive.has(s.b)) continue;
      Body.setPosition(s.b, {x: s.x, y: s.y});
      Body.setAngle(s.b, s.a);
      Body.setVelocity(s.b, {x: 0, y: 0});
      Body.setAngularVelocity(s.b, 0);
    }
  }
  for (const b of Composite.allBodies(world)) meta(b).trail = [];
  snapshot = null; time = 0; graph.length = 0; updateClock();
}
function updateClock() { document.getElementById('clock').textContent = 't = ' + time.toFixed(2) + ' s'; }

Events.on(engine, 'beforeUpdate', () => {
  for (const b of Composite.allBodies(world)) {
    const m = meta(b);
    if (m.motor && !b.isStatic) Body.setAngularVelocity(b, m.motor);
  }
});

function stepOnce() {
  const slow = document.getElementById('slow').checked ? 0.25 : 1;
  Engine.update(engine, (1000 / 60) * slow);
  time += (1 / 60) * slow;
  for (const b of Composite.allBodies(world)) {
    const m = meta(b);
    if (m.fixedWorld) continue;
    if (b === selected || m.trailOn) { m.trail.push({x: b.position.x, y: b.position.y}); if (m.trail.length > 240) m.trail.shift(); }
  }
  if (selected) { graph.push(speedOf(selected)); if (graph.length > 600) graph.shift(); }
  updateClock();
}
function speedOf(b) { return Vector.magnitude(b.velocity) * 60 / PX_PER_M; }

// ------------------------------------------------------------------ tools
const ICONS = {
  hand: '<path d="M8 13 V5 a1.5 1.5 0 0 1 3 0 V11 M11 10 V3.5 a1.5 1.5 0 0 1 3 0 V11 M14 10 V5 a1.5 1.5 0 0 1 3 0 V12 M17 11 a1.5 1.5 0 0 1 3 0 V15 c0 4-3 6-6 6 h-2 c-3 0-4-2-6-5 l-2-3 a1.5 1.5 0 0 1 2.5-1.5 L8 13" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>',
  ball: '<circle cx="12" cy="12" r="8" fill="none" stroke="#000" stroke-width="2"/><path d="M12 12 L19 9" stroke="#000" stroke-width="1.5"/>',
  box: '<rect x="4" y="6" width="16" height="12" fill="none" stroke="#000" stroke-width="2"/>',
  ramp: '<path d="M3 19 H21 V6 Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>',
  ragdoll: '<circle cx="12" cy="5" r="3" class="f" fill="#000" stroke="#000"/><path d="M12 8 V15 M12 10 L7 13 M12 10 L17 12 M12 15 L8 21 M12 15 L16 21" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>',
  spring: '<path d="M3 12 H6 L8 6 L11 18 L14 6 L17 18 L19 12 H21" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>',
  rod: '<path d="M4 18 L20 6" stroke="#000" stroke-width="3" stroke-linecap="round"/><circle cx="4" cy="18" r="2" class="f" fill="#000"/><circle cx="20" cy="6" r="2" class="f" fill="#000"/>',
  pin: '<circle cx="12" cy="12" r="5" fill="none" stroke="#000" stroke-width="2"/><path d="M12 5 V19 M5 12 H19" stroke="#000" stroke-width="1.5"/>',
  motor: '<path d="M18 8 A7 7 0 1 0 19 13" fill="none" stroke="#000" stroke-width="2"/><path d="M15 4 L19 8 L14 10" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>',
  anchor: '<path d="M12 4 V20 M7 9 H17 M5 15 C6 19 10 20 12 20 C14 20 18 19 19 15" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="4" r="2" fill="none" stroke="#000" stroke-width="1.5"/>',
  erase: '<path d="M8 20 H20 M4 16 L14 6 L19 11 L11 19 H8 Z" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>',
  trail: '<path d="M3 18 C8 18 8 6 13 6 S18 14 21 10" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="2 2.5"/>'
};
const TOOLS = [
  ['hand', 'Hand', 'Drag things. Click one to see its numbers.'],
  ['ball', 'Ball', 'Drag to draw a ball.'],
  ['box', 'Box', 'Drag to draw a box.'],
  ['ramp', 'Ramp', 'Drag to draw a ramp. It slopes down the way you drag.'],
  ['ragdoll', 'Ragdoll', 'Click to drop a ragdoll stickman (its feet go where you click).'],
  ['spring', 'Spring', 'Drag from one thing to another (or to the background).'],
  ['rod', 'Rod', 'Drag from one thing to another to join them with a stiff rod.'],
  ['pin', 'Pin', 'Click where two things overlap to pin them, or on one thing to pin it to the background.'],
  ['motor', 'Motor', 'Click a thing to make it spin. Click again to stop it.'],
  ['anchor', 'Anchor', 'Click a thing to fix it in place. Click again to free it.'],
  ['trail', 'Trace', 'Click a thing to draw its path when it moves.'],
  ['erase', 'Erase', 'Click a thing, spring, rod or pin to remove it.']
];
let tool = 'hand';
const toolsEl = document.getElementById('tools');
for (const [id, label] of TOOLS) {
  const b = document.createElement('button');
  b.className = 'tool' + (id === tool ? ' on' : ''); b.dataset.tool = id; b.title = label;
  b.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[id] + '</svg>' + label;
  b.onclick = () => setTool(id);
  toolsEl.appendChild(b);
}
function setTool(id) {
  tool = id;
  for (const b of toolsEl.children) b.classList.toggle('on', b.dataset.tool === id);
  document.getElementById('hint').textContent = TOOLS.find(t => t[0] === id)[2];
  canvas.style.cursor = id === 'hand' ? 'grab' : 'crosshair';
}

function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H};
}
function bodiesAt(p) {
  return Query.point(Composite.allBodies(world).filter(b => !meta(b).fixedWorld), p).reverse();
}
function constraintAt(p) {
  let best = null, bestD = 10;
  for (const c of Composite.allConstraints(world)) {
    const a = Constraint.pointAWorld(c), b = Constraint.pointBWorld(c);
    const d = distToSegment(p, a, b);
    if (d < bestD) { best = c; bestD = d; }
  }
  return best;
}
function distToSegment(p, a, b) {
  const l = Vector.magnitudeSquared(Vector.sub(b, a));
  if (!l) return Vector.magnitude(Vector.sub(p, a));
  const t = Math.max(0, Math.min(1, Vector.dot(Vector.sub(p, a), Vector.sub(b, a)) / l));
  return Vector.magnitude(Vector.sub(p, Vector.add(a, Vector.mult(Vector.sub(b, a), t))));
}

let drag = null;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const p = toWorld(e);
  const hit = bodiesAt(p)[0] || null;
  if (tool === 'hand') {
    if (hit) {
      select(hit);
      if (running) {
        const c = Constraint.create({pointA: {x: p.x, y: p.y}, bodyB: hit, pointB: Vector.sub(p, hit.position), stiffness: 0.08, damping: 0.1, length: 0});
        Composite.add(world, c);
        drag = {mode: 'pull', c};
      } else if (!hit.isStatic || meta(hit).kind) {
        drag = {mode: 'move', bodies: groupOf(hit), last: p};
      }
      canvas.style.cursor = 'grabbing';
    } else {
      select(null);
    }
    return;
  }
  if (tool === 'ball' || tool === 'box' || tool === 'ramp' || tool === 'spring' || tool === 'rod') {
    drag = {mode: 'draw', start: p, end: p, startBody: hit};
    return;
  }
  if (tool === 'ragdoll') { ragdoll(p.x, Math.min(p.y, H)); afterEdit(); return; }
  if (tool === 'pin') {
    const hits = bodiesAt(p);
    if (hits.length >= 2) link('pin', hits[0], p, hits[1], p);
    else if (hits.length === 1) link('pin', null, p, hits[0], p);
    afterEdit();
    return;
  }
  if (!hit && tool !== 'erase') return;
  if (tool === 'motor') { const m = meta(hit); m.motor = m.motor ? 0 : 0.08; if (!m.motor) Body.setAngularVelocity(hit, 0); select(hit); }
  if (tool === 'anchor') { Body.setStatic(hit, !hit.isStatic); select(hit); }
  if (tool === 'trail') { const m = meta(hit); m.trailOn = !m.trailOn; m.trail = []; select(hit); }
  if (tool === 'erase') {
    const c = constraintAt(p);
    if (hit) removeBody(hit); else if (c) Composite.remove(world, c);
  }
  afterEdit();
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toWorld(e);
  if (drag.mode === 'pull') drag.c.pointA = {x: p.x, y: p.y};
  if (drag.mode === 'move') {
    const d = Vector.sub(p, drag.last);
    for (const b of drag.bodies) { Body.setPosition(b, Vector.add(b.position, d)); Body.setVelocity(b, {x: 0, y: 0}); }
    drag.last = p;
  }
  if (drag.mode === 'draw') drag.end = p;
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  canvas.style.cursor = tool === 'hand' ? 'grab' : 'crosshair';
  if (d.mode === 'pull') { Composite.remove(world, d.c); return; }
  if (d.mode === 'move') { afterEdit(); return; }
  const a = d.start, b = d.end;
  const dx = b.x - a.x, dy = b.y - a.y;
  const color = COLORS[Math.floor(Math.random() * 7)];
  let made = null;
  if (tool === 'ball') made = ball(a.x, a.y, Math.max(10, Math.hypot(dx, dy)), color);
  if (tool === 'box') {
    const w = Math.max(14, Math.abs(dx)), h = Math.max(14, Math.abs(dy));
    made = box(a.x + (Math.abs(dx) < 14 ? 0 : dx / 2), a.y + (Math.abs(dy) < 14 ? 0 : dy / 2), w, h, color);
  }
  if (tool === 'ramp' && Math.abs(dx) > 20 && Math.abs(dy) > 10) made = ramp(a.x, a.y, b.x, b.y);
  if ((tool === 'spring' || tool === 'rod') && Math.hypot(dx, dy) > 12) {
    const endBody = bodiesAt(b)[0] || null;
    if (d.startBody || endBody) link(tool, d.startBody, a, endBody, b);
  }
  if (made) select(made);
  afterEdit();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// when something is changed while stopped, Reset goes back to the new layout
function afterEdit() { if (!running) snapshot = null; }

// ------------------------------------------------------------------ inspector
const insp = document.getElementById('inspector');
function select(b) {
  selected = b; graph.length = 0;
  document.getElementById('graphnote').textContent = b ? 'Speed of the ' + meta(b).kind.toLowerCase() + ' (m/s) over time.' : 'Pick an object, then press Run.';
  buildInspector();
}
function slider(label, min, max, step, value, fn) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = '<span>' + label + '</span>';
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = value;
  r.oninput = () => fn(parseFloat(r.value));
  row.appendChild(r); return row;
}
function buildInspector() {
  insp.textContent = '';
  const b = selected;
  if (!b) { insp.innerHTML = '<p class="muted">Click something with the Hand to see its numbers and change it.</p>'; return; }
  const m = meta(b);
  const h = document.createElement('div'); h.className = 'row'; h.innerHTML = '<b>' + m.kind + (m.part ? ' (' + m.part + ')' : '') + '</b>';
  insp.appendChild(h);
  const read = document.createElement('div'); read.className = 'read'; read.id = 'readout'; insp.appendChild(read);
  insp.appendChild(slider('Bounciness', 0, 1, 0.05, b.restitution, v => { for (const x of groupOf(b)) x.restitution = v; }));
  insp.appendChild(slider('Friction', 0, 1, 0.05, b.friction, v => { for (const x of groupOf(b)) x.friction = v; }));
  if (!m.group) insp.appendChild(slider('Heaviness', 0.0002, 0.03, 0.0002, b.density, v => Body.setDensity(b, v)));
  if (m.motor) insp.appendChild(slider('Motor speed', -0.3, 0.3, 0.01, m.motor, v => { m.motor = v || 0.001; }));
  const sw = document.createElement('div'); sw.className = 'swatches';
  for (const c of COLORS) {
    const s = document.createElement('button'); s.className = 'sw' + (c === m.color ? ' on' : ''); s.style.background = c; s.title = c;
    s.onclick = () => { for (const x of groupOf(b)) meta(x).color = c; buildInspector(); };
    sw.appendChild(s);
  }
  insp.appendChild(sw);
  const fixed = document.createElement('label'); fixed.className = 'chk';
  fixed.innerHTML = '<input type="checkbox"' + (b.isStatic ? ' checked' : '') + '> Anchored (does not move)';
  fixed.querySelector('input').onchange = e => { Body.setStatic(b, e.target.checked); };
  insp.appendChild(fixed);
  updateReadout();
}
function updateReadout() {
  const el = document.getElementById('readout');
  if (!el || !selected) return;
  const b = selected;
  const v = Vector.mult(b.velocity, 60 / PX_PER_M);
  const mass = b.isStatic ? Infinity : b.mass;
  const kg = mass === Infinity ? 'fixed' : (mass * 10).toFixed(1) + ' kg';
  const ke = mass === Infinity ? 0 : 0.5 * mass * 10 * (v.x * v.x + v.y * v.y);
  el.innerHTML = 'x<b>' + (b.position.x / PX_PER_M).toFixed(2) + ' m</b>y<b>' + ((H - b.position.y) / PX_PER_M).toFixed(2) + ' m</b>' +
    'speed<b>' + Math.hypot(v.x, v.y).toFixed(2) + ' m/s</b>vx<b>' + v.x.toFixed(2) + ' m/s</b>vy<b>' + (-v.y).toFixed(2) + ' m/s</b>' +
    'angle<b>' + ((b.angle * 180 / Math.PI) % 360).toFixed(0) + '&deg;</b>mass<b>' + kg + '</b>energy<b>' + ke.toFixed(1) + ' J</b>';
}

// ------------------------------------------------------------------ drawing
function drawGrid() {
  ctx.strokeStyle = '#e6e6e6'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += PX_PER_M) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = H; y >= 0; y -= PX_PER_M) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
}
let hatch = null;
function hatchFor(color) {
  const c = document.createElement('canvas'); c.width = c.height = 8;
  const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, 8, 8);
  x.strokeStyle = 'rgba(0,0,0,.45)'; x.lineWidth = 1; x.beginPath(); x.moveTo(0, 8); x.lineTo(8, 0); x.stroke();
  return ctx.createPattern(c, 'repeat');
}
const hatchCache = {};
function drawBody(b) {
  const m = meta(b);
  if (m.hidden) return;
  ctx.lineWidth = 2; ctx.strokeStyle = '#000';
  ctx.fillStyle = b.isStatic ? (hatchCache[m.color] || (hatchCache[m.color] = hatchFor(m.color))) : m.color;
  if (m.kind === 'Ragdoll' && m.part !== 'head') {
    const v = b.vertices;
    const a1 = {x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2}, a2 = {x: (v[2].x + v[3].x) / 2, y: (v[2].y + v[3].y) / 2};
    const w = Math.hypot(v[1].x - v[0].x, v[1].y - v[0].y);
    const cut = w * 0.3 / (Math.hypot(a2.x - a1.x, a2.y - a1.y) || 1);
    ctx.lineCap = 'round'; ctx.strokeStyle = m.color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(a1.x + (a2.x - a1.x) * cut, a1.y + (a2.y - a1.y) * cut);
    ctx.lineTo(a2.x - (a2.x - a1.x) * cut, a2.y - (a2.y - a1.y) * cut); ctx.stroke(); ctx.lineCap = 'butt';
  } else if (b.circleRadius) {
    ctx.beginPath(); ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (m.part !== 'head') {
      ctx.beginPath(); ctx.moveTo(b.position.x, b.position.y);
      ctx.lineTo(b.position.x + Math.cos(b.angle) * b.circleRadius, b.position.y + Math.sin(b.angle) * b.circleRadius); ctx.stroke();
    }
  } else {
    const parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
    for (const part of parts) {
      ctx.beginPath();
      part.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  if (m.motor) {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    const r = (b.circleRadius || 20) * 0.55;
    ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, b.angle, b.angle + Math.PI * 1.5); ctx.stroke();
    const end = {x: b.position.x + Math.cos(b.angle + Math.PI * 1.5) * r, y: b.position.y + Math.sin(b.angle + Math.PI * 1.5) * r};
    ctx.beginPath(); ctx.arc(end.x, end.y, 3, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
  }
  if (b === selected) {
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    const bb = b.bounds; ctx.strokeRect(bb.min.x - 5, bb.min.y - 5, bb.max.x - bb.min.x + 10, bb.max.y - bb.min.y + 10); ctx.restore();
  }
}
function drawConstraint(c) {
  const t = c.plugin && c.plugin.sp && c.plugin.sp.type;
  if (!t) return; // the Hand's invisible pull
  const a = Constraint.pointAWorld(c), b = Constraint.pointBWorld(c);
  ctx.strokeStyle = '#000';
  if (t === 'joint') return; // ragdoll joints are hidden
  if (t === 'pin') {
    ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
    return;
  }
  if (t === 'rod') {
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  } else {
    const d = Vector.sub(b, a), len = Vector.magnitude(d) || 1, n = {x: -d.y / len, y: d.x / len};
    const coils = 12; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a.x, a.y);
    for (let i = 1; i < coils; i++) {
      const p = Vector.add(a, Vector.mult(d, i / coils)), s = (i % 2 ? 1 : -1) * 8;
      ctx.lineTo(p.x + n.x * s, p.y + n.y * s);
    }
    ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const p of [a, b]) { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); }
}
function arrow(x, y, dx, dy, color) {
  const len = Math.hypot(dx, dy); if (len < 4) return;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  const a = Math.atan2(dy, dx);
  ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
  ctx.lineTo(x + dx - 10 * Math.cos(a - 0.4), y + dy - 10 * Math.sin(a - 0.4));
  ctx.lineTo(x + dx - 10 * Math.cos(a + 0.4), y + dy - 10 * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill();
}
function drawRagdollFaces() {
  for (const b of Composite.allBodies(world)) {
    const m = meta(b);
    if (m.part !== 'head') continue;
    ctx.fillStyle = '#fff';
    const r = b.circleRadius;
    for (const s of [-1, 1]) {
      const ex = b.position.x + Math.cos(b.angle) * s * r * 0.35 - Math.sin(b.angle) * -r * 0.1;
      const ey = b.position.y + Math.sin(b.angle) * s * r * 0.35 + Math.cos(b.angle) * -r * 0.1;
      ctx.beginPath(); ctx.arc(ex, ey, r * 0.14, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function draw() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (document.getElementById('grid').checked) drawGrid();
  // trails
  for (const b of Composite.allBodies(world)) {
    const tr = meta(b).trail;
    if (!tr || tr.length < 2) continue;
    ctx.fillStyle = '#000';
    for (let i = 0; i < tr.length; i += 4) { ctx.fillRect(tr[i].x - 1.5, tr[i].y - 1.5, 3, 3); }
  }
  for (const b of Composite.allBodies(world)) drawBody(b);
  drawRagdollFaces();
  for (const c of Composite.allConstraints(world)) drawConstraint(c);
  if (document.getElementById('vectors').checked) {
    for (const b of Composite.allBodies(world)) {
      const m = meta(b);
      if (b.isStatic || m.fixedWorld || (m.group && m.part !== 'torso' && m.kind === 'Ragdoll')) continue;
      if (b !== selected && Vector.magnitude(b.velocity) < 0.3) continue;
      arrow(b.position.x, b.position.y, b.velocity.x * 6, b.velocity.y * 6, b === selected ? '#d00000' : '#0050c8');
    }
  }
  // what is being drawn right now
  if (drag && drag.mode === 'draw') {
    const a = drag.start, b = drag.end;
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    if (tool === 'ball') { ctx.beginPath(); ctx.arc(a.x, a.y, Math.max(10, Math.hypot(b.x - a.x, b.y - a.y)), 0, Math.PI * 2); ctx.stroke(); }
    if (tool === 'box') ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    if (tool === 'ramp') {
      const left = Math.min(a.x, b.x), right = Math.max(a.x, b.x), top = Math.min(a.y, b.y), bottom = Math.max(a.y, b.y);
      ctx.beginPath();
      if (b.x > a.x) { ctx.moveTo(left, top); ctx.lineTo(right, bottom); ctx.lineTo(left, bottom); }
      else { ctx.moveTo(right, top); ctx.lineTo(right, bottom); ctx.lineTo(left, bottom); }
      ctx.closePath(); ctx.stroke();
    }
    if (tool === 'spring' || tool === 'rod') { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.restore();
  }
  if (!running && time === 0) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.font = 'bold 15px Geneva, Verdana, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('Press Run to start', W - 14, 26); ctx.textAlign = 'left';
  }
}
const gctx = document.getElementById('graph').getContext('2d');
function drawGraph() {
  const w = 440, h = 180;
  gctx.fillStyle = '#fff'; gctx.fillRect(0, 0, w, h);
  gctx.strokeStyle = '#ddd'; gctx.lineWidth = 1; gctx.beginPath();
  for (let y = 0; y <= h; y += 36) { gctx.moveTo(0, y + 0.5); gctx.lineTo(w, y + 0.5); }
  gctx.stroke();
  if (graph.length < 2) return;
  const max = Math.max(2, ...graph) * 1.1;
  gctx.strokeStyle = '#000'; gctx.lineWidth = 2.5; gctx.beginPath();
  graph.forEach((v, i) => { const x = i / 600 * w, y = h - v / max * (h - 10); i ? gctx.lineTo(x, y) : gctx.moveTo(x, y); });
  gctx.stroke();
  gctx.fillStyle = '#000'; gctx.font = '20px Monaco, monospace';
  gctx.fillText(graph[graph.length - 1].toFixed(2) + ' m/s', 8, 24);
  gctx.fillText('max ' + (max / 1.1).toFixed(1), w - 130, 24);
}

let lastReadout = 0;
function frame(now) {
  if (running) stepOnce();
  draw();
  if (now - lastReadout > 100) { updateReadout(); drawGraph(); lastReadout = now; }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ controls
document.getElementById('run').onclick = () => (running ? stop() : run());
document.getElementById('step').onclick = () => { if (!snapshot) takeSnapshot(); stop(); for (let i = 0; i < 6; i++) stepOnce(); };
document.getElementById('reset').onclick = reset;
document.getElementById('clear').onclick = () => { if (confirm('Clear everything?')) { document.getElementById('scene').value = 'empty'; loadScene('empty'); } };
document.getElementById('scene').onchange = e => loadScene(e.target.value);
document.getElementById('gravity').onchange = e => { engine.gravity.y = parseFloat(e.target.value); };
document.getElementById('air').onchange = () => { for (const b of Composite.allBodies(world)) if (!meta(b).fixedWorld) b.frictionAir = Math.max(meta(b).kind === 'Ragdoll' ? 0.01 : 0, airValue()); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); running ? stop() : run(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected && !meta(selected).fixedWorld) { removeBody(selected); afterEdit(); }
});

window.StickPhysics = {engine, world, Composite, meta, run, stop, reset, loadScene, setTool, get running () { return running; }, get time () { return time; }};
setTool('hand');
loadScene('stairs');
requestAnimationFrame(frame);
})();
</script>
</body>
