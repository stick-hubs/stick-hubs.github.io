<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkSheet++ · Daily worksheets · Stick Hubs</title>
<meta name="description" content="WorkSheet++: learn fractions, English or anything you like with a fresh worksheet on the days you choose. XP, streaks and a timetable.">
<meta property="og:title" content="WorkSheet++ · Stick Hubs">
<meta property="og:description" content="A stickman quiz for up to 32 players, made by Stick Manx.">
<meta property="og:image" content="https://stick-hubs.github.io/og-image.jpg">
<meta name="theme-color" content="#1c5fa8">
<link rel="icon" href="lab/favicon.ico">
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px "Segoe UI", "Segoe UI Web", Tahoma, "Noto Sans", Arial, sans-serif;
  color: #1e2a3a; overflow: hidden;
  /* an original "aurora" desktop in the spirit of the 2009 era */
  background:
    radial-gradient(ellipse 60% 45% at 30% 75%, rgba(120, 220, 255, .55), transparent 70%),
    radial-gradient(ellipse 50% 60% at 75% 30%, rgba(80, 170, 255, .5), transparent 70%),
    radial-gradient(ellipse 120% 40% at 50% 110%, rgba(40, 200, 140, .35), transparent 70%),
    linear-gradient(160deg, #0b3a78 0%, #1565b8 40%, #0f4f9c 70%, #062b5c 100%);
}
body::before { /* soft light streaks */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(115deg, transparent 30%, rgba(255,255,255,.18) 42%, transparent 52%),
    linear-gradient(100deg, transparent 50%, rgba(170,240,255,.15) 60%, transparent 68%),
    linear-gradient(125deg, transparent 15%, rgba(255,255,255,.08) 22%, transparent 30%);
}
.desktop { position: fixed; inset: 0 0 40px 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.back { position: fixed; top: 12px; left: 12px; color: #fff; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.8); width: 76px; padding: 4px; border-radius: 3px; border: 1px solid transparent; z-index: 2; }
.back:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4); }
.back svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }

/* the Aero window */
.win { width: min(920px, 100%); height: min(680px, 100%); display: flex; flex-direction: column; border-radius: 8px; position: relative;
  background: rgba(160, 200, 240, .38); border: 1px solid rgba(20, 40, 70, .7);
  box-shadow: 0 0 0 1px rgba(255,255,255,.45) inset, 0 12px 40px rgba(0,0,0,.55);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); }
.win::before { content: ""; position: absolute; inset: 0; border-radius: 8px; pointer-events: none;
  background: linear-gradient(170deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.08) 18%, transparent 30%); }
.titlebar { height: 30px; display: flex; align-items: center; padding: 0 0 0 10px; gap: 8px; position: relative; z-index: 1; }
.titlebar .logo { width: 18px; height: 18px; }
.titlebar h1 { font: 13px "Segoe UI", Tahoma, sans-serif; margin: 0; flex: 1; color: #000; text-shadow: 0 0 10px #fff, 0 0 6px #fff, 0 0 3px #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caps { display: flex; align-self: flex-start; margin-right: 6px; border: 1px solid rgba(0,0,0,.55); border-top: 0; border-radius: 0 0 5px 5px; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.5); }
.caps span { width: 27px; height: 19px; display: flex; align-items: center; justify-content: center; color: #fff; font: bold 11px Arial, sans-serif; text-shadow: 0 0 2px #000, 0 1px 2px #000;
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.2) 50%, rgba(0,0,0,.08) 51%, rgba(255,255,255,.25)); border-left: 1px solid rgba(0,0,0,.35); }
.caps span:first-child { border-left: 0; }
.caps .close { width: 46px; background: linear-gradient(180deg, #e8a493, #d4563f 50%, #c13c22 51%, #d9683e); }
.caps a { color: inherit; text-decoration: none; display: contents; }
.client { flex: 1; margin: 0 7px 7px; background: #fff; border: 1px solid rgba(40, 70, 110, .65); border-radius: 2px; overflow: auto; position: relative; z-index: 1; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }

/* taskbar */
.taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: linear-gradient(180deg, rgba(30, 60, 100, .55), rgba(10, 25, 45, .75)); border-top: 1px solid rgba(255,255,255,.35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 3; }
.orb { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;
  background: radial-gradient(circle at 50% 30%, #9fe3ff, #2a8fd8 45%, #0b4c94 75%, #062a55); border: 1px solid rgba(0,0,0,.6);
  box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 0 10px rgba(120, 210, 255, .5); }
.task { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #fff; font-size: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.5);
  background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.1) 50%, rgba(255,255,255,.04) 51%, rgba(255,255,255,.15)); box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset; }
.grow { flex: 1; }
#clock { color: #fff; font-size: 11px; text-align: center; line-height: 1.25; padding: 0 6px; }

/* content */
.pane { padding: 18px 22px 22px; max-width: 860px; margin: 0 auto; }
.center { text-align: center; }
h1, h2 { font-weight: normal; color: #1e3287; margin: 4px 0 8px; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
.sub { color: #4a5a70; margin: 2px 0 12px; }
.small { font-size: 12px; color: #6a7686; }
.hero { display: flex; gap: 18px; align-items: center; padding: 10px 6px 16px; border-bottom: 1px solid #dde6f2; margin-bottom: 14px; }
fieldset { border: 1px solid #cdd8e6; border-radius: 4px; padding: 8px 14px 10px; margin: 0 0 14px; }
legend { color: #1e3287; padding: 0 4px; }
.field { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
.field input, .field select { font: inherit; padding: 4px 6px; border: 1px solid #abadb3; border-top-color: #8e8f8f; border-radius: 2px; min-width: 200px; background: #fff; }
.field input:focus, .field select:focus, .codein:focus { outline: none; border-color: #3d7bad; box-shadow: 0 0 0 1px #b5d4ee; }
.check { display: block; margin: 6px 0; }
.sws { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(0,0,0,.4); cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.6) inset; }
.sw.on { outline: 2px solid #3d7bad; outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.tile { font: inherit; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px; cursor: pointer; color: #1e2a3a;
  border: 1px solid transparent; border-radius: 3px; background: none; }
.tile:hover, .tile:focus-visible { border-color: #7da2ce; background: linear-gradient(180deg, #fafbfd, #ebf3fd); box-shadow: inset 0 0 0 1px #fff; outline: none; }
.tile b { color: #1e3287; font-size: 16px; font-weight: normal; }
.tile span:last-child { color: #4a5a70; font-size: 12.5px; }
.ti { font-size: 28px; }

/* Aero buttons */
.aero { font: inherit; padding: 5px 18px; min-width: 86px; cursor: pointer; color: #1e2a3a; border-radius: 3px; border: 1px solid #707070;
  background: linear-gradient(180deg, #f2f2f2 0%, #ebebeb 49%, #dddddd 50%, #cfcfcf 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.75); }
.aero:hover:not(:disabled) { border-color: #3c7fb1; background: linear-gradient(180deg, #eaf6fd 0%, #d9f0fc 49%, #bee6fd 50%, #a7d9f5 100%); }
.aero:active:not(:disabled) { border-color: #2c628b; background: linear-gradient(180deg, #e5f4fc, #c4e5f6 49%, #98d1ef 50%, #68b3db); }
.aero.primary { border-color: #3c7fb1; box-shadow: inset 0 0 0 1px #48d6fd; }
.aero.big { padding: 8px 22px; font-size: 15px; }
.aero:disabled { color: #8d8d8d; border-color: #adb2b5; background: #f4f4f4; cursor: default; box-shadow: none; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.row.pad { padding: 0 22px 22px; max-width: 860px; margin: 0 auto; }
.x { border: 0; background: none; font-size: 18px; color: #9a3b2b; cursor: pointer; margin-left: auto; }

/* lobby */
.joinbox { display: flex; gap: 18px; align-items: center; padding: 12px; border: 1px solid #cdd8e6; border-radius: 4px; background: linear-gradient(180deg, #fbfdff, #eef4fb); flex-wrap: wrap; }
.qr { width: 168px; height: 168px; background: #fff; border: 1px solid #cdd8e6; flex: none; }
.qr svg { width: 100%; height: 100%; display: block; }
.label { color: #4a5a70; font-size: 12.5px; max-width: 420px; }
.code { font: 600 46px "Segoe UI", Tahoma, sans-serif; letter-spacing: 4px; color: #1e3287; line-height: 1.1; margin: 2px 0 6px; }
.url { font: 12px Consolas, monospace; color: #2a5a8a; margin-top: 6px; word-break: break-all; }
.status { margin-top: 6px; font-size: 12px; }
.status.open { color: #2b7a2b; }
.status.open::before { content: "\25CF  "; }
.status:not(.open) { color: #a06800; }
.grouphead { margin: 16px 0 6px; color: #1e3287; border-bottom: 1px solid #dde6f2; padding-bottom: 3px; display: flex; justify-content: space-between; }
.players { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.players li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid #e1e8f1; border-radius: 3px; background: #fbfcfe; animation: pop .25s ease-out; overflow: hidden; }
.players li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.players li.empty { grid-column: 1 / -1; color: #6a7686; justify-content: center; padding: 14px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }

/* questions */
.qhead { display: flex; justify-content: space-between; color: #4a5a70; font-size: 13px; }
.question { font-size: 24px; color: #1e2a3a; margin: 8px 0 12px; line-height: 1.3; }
.timer { position: relative; height: 22px; border: 1px solid #9ab; border-radius: 3px; background: #e6e6e6; overflow: hidden; margin-bottom: 14px; }
.timer i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .25s linear;
  background: linear-gradient(180deg, #c9f7b9, #4bc93a 50%, #2fae20 51%, #5ad848); }
.timer b { position: absolute; inset: 0; text-align: center; font-weight: 600; line-height: 20px; text-shadow: 0 0 4px #fff, 0 0 2px #fff; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { font: inherit; font-size: 17px; color: #fff; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 12px; cursor: pointer; border-radius: 5px;
  border: 1px solid rgba(0,0,0,.45); text-shadow: 0 1px 2px rgba(0,0,0,.45); position: relative; transition: transform .08s, opacity .2s, filter .2s;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.2); }
.ans::after { content: ""; position: absolute; left: 1px; right: 1px; top: 1px; height: 48%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.12)); pointer-events: none; }
.ans:hover:not(:disabled) { filter: brightness(1.1); }
.ans:active:not(:disabled) { transform: scale(.98); }
.ans:disabled { cursor: default; }
.a0 { background: linear-gradient(180deg, #e9675d, #c7362b); }
.a1 { background: linear-gradient(180deg, #4f93e6, #1f5fb6); }
.a2 { background: linear-gradient(180deg, #efb53c, #c98a0b); }
.a3 { background: linear-gradient(180deg, #5cbd59, #2f8b2e); }
.ans .l { width: 32px; height: 32px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.55); }
.ans .t { flex: 1; }
.ans .count { background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 9px; font-size: 14px; }
.ans.dim { opacity: .35; }
.ans.picked { outline: 3px solid #1e3287; outline-offset: 2px; opacity: 1; }
.ans.right { animation: glow 1s ease-in-out 2; box-shadow: 0 0 0 3px #fff, 0 0 14px 4px rgba(80, 220, 80, .9); }
.ans.right::before { content: "\2714"; position: absolute; right: 10px; top: -10px; width: 24px; height: 24px; border-radius: 50%; background: #2fae20; border: 2px solid #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
@keyframes glow { 50% { transform: scale(1.03); } }
.answered { color: #4a5a70; }
.verdict { font-size: 18px; }
.verdict.good, .result.good .big { color: #2b7a2b; }
.verdict.bad, .result.bad .big { color: #b3261e; }
.result { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 10px 14px; border-radius: 4px; border: 1px solid #cdd8e6; background: linear-gradient(180deg, #fbfdff, #eef4fb); }
.result .big { font-size: 22px; }
.locked { margin-top: 16px; font-size: 16px; }
.board { list-style: none; padding: 0; margin: 0; counter-reset: r; }
.board li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid #eef2f7; counter-increment: r; }
.board:not(.full) li::before { content: counter(r); width: 18px; color: #6a7686; text-align: right; }
.board li span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board li em { color: #2b7a2b; font-style: normal; font-size: 12px; }
.board li.me { background: #eaf3fd; }
.board .rank { flex: none !important; width: 22px; color: #6a7686; text-align: right; }

/* podium */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 14px 0 18px; }
.step { display: flex; flex-direction: column; align-items: center; width: 140px; animation: rise .6s ease-out both; }
.step.s2 { animation-delay: .3s; } .step.s3 { animation-delay: .5s; } .step.s1 { animation-delay: .8s; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.pname { font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pscore { color: #4a5a70; font-size: 13px; margin-bottom: 4px; }
.block { width: 100%; color: #fff; font: 700 28px "Segoe UI", sans-serif; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; border-radius: 4px 4px 0 0; border: 1px solid rgba(0,0,0,.35);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.s1 .block { height: 120px; background: linear-gradient(180deg, #ffe17a, #d9a40c 50%, #c48f00 51%, #e0b12a); }
.s2 .block { height: 86px; background: linear-gradient(180deg, #eef2f6, #aab4bf 50%, #98a3ae 51%, #b8c1ca); }
.s3 .block { height: 64px; background: linear-gradient(180deg, #f1c49a, #c07a3c 50%, #ad6a2e 51%, #c98a4f); }

/* server list */
.servers { width: 100%; border-collapse: collapse; border: 1px solid #cdd8e6; }
.servers th { text-align: left; font-weight: normal; color: #4a5a70; padding: 5px 8px; border-bottom: 1px solid #d5dfe9; background: linear-gradient(180deg, #fff, #f1f5fb); }
.servers td { padding: 7px 8px; border-bottom: 1px solid #eef2f7; }
.servers tr:hover td { background: #eaf3fd; }
.servers .empty { text-align: center; color: #6a7686; padding: 24px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 9px; background: #eef1f5; color: #4a5a70; border: 1px solid #d5dbe3; }
.tag.ok { background: #e3f5df; color: #2b7a2b; border-color: #b6dfae; }
.codein { font: 600 40px "Segoe UI", Tahoma, sans-serif; letter-spacing: 6px; text-align: center; width: 260px; max-width: 100%; padding: 6px; border: 1px solid #abadb3; border-radius: 3px; margin: 10px auto; display: block; }
.spinner { width: 34px; height: 34px; margin: 10px auto; border-radius: 50%; border: 4px solid #d6e6f6; border-top-color: #2a8fd8; animation: spin 1s linear infinite; }
.spinner.small { width: 16px; height: 16px; border-width: 3px; display: inline-block; vertical-align: middle; margin: 0 6px 0 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.stick { flex: none; }
@media (max-width: 520px) { .sheet { flex-wrap: wrap; } .sheet .grow { min-width: 60%; } .wsbar { padding: 6px 8px; } .pane { padding: 12px; } }
#toast { position: fixed; bottom: 52px; right: 14px; max-width: 300px; padding: 10px 14px; border-radius: 4px; z-index: 5;
  background: linear-gradient(180deg, #fffef0, #fff6c8); border: 1px solid #a6923c; box-shadow: 0 4px 14px rgba(0,0,0,.35); color: #333; }


/* quiz maker */
.qcard { background: linear-gradient(180deg, #fbfdff, #f3f7fc); }
.qcard textarea { width: 100%; font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid #abadb3; border-radius: 2px; resize: vertical; }
.qcard textarea:focus, .ansrow input:focus { outline: none; border-color: #3d7bad; box-shadow: 0 0 0 1px #b5d4ee; }
.ansgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.ansrow { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); }
.ansrow .l { width: 26px; height: 26px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.ansrow input { flex: 1; min-width: 0; font: inherit; padding: 5px 6px; border: 1px solid #abadb3; border-radius: 2px; }
.a0b { background: #e6f5e3; border-color: #9fd394; } .a0b .l { background: #2f8b2e; }
.a1b, .a2b, .a3b { background: #fbefee; border-color: #e7b9b4; } .a1b .l, .a2b .l, .a3b .l { background: #c7362b; }
.qtools { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.qtools .aero { min-width: 0; padding: 3px 10px; }
.acts { text-align: right; white-space: nowrap; }
.acts .aero { min-width: 0; padding: 3px 10px; margin: 2px; }
.filebtn { display: inline-block; }
@media (max-width: 640px) { .ansgrid { grid-template-columns: 1fr; } .acts { white-space: normal; } }
@media (max-width: 640px) {
  .desktop { padding: 0; inset: 0 0 40px 0; }
  .win { height: 100%; border-radius: 0; }
  .back { display: none; }
  .pane { padding: 12px 12px 16px; }
  .answers { grid-template-columns: 1fr; }
  .ans { min-height: 56px; }
  .question { font-size: 20px; }
  .code { font-size: 38px; }
  .qr { width: 140px; height: 140px; }
  .hero h1 { font-size: 24px; }
  .servers th:nth-child(2), .servers td:nth-child(2) { display: none; }
  .task span { display: none; }
}

/* WorkSheet++ */
.wsbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid #cdd8e6;
  background: linear-gradient(180deg, #fbfdff, #e9f1fb); position: sticky; top: 0; z-index: 2; }
.stats { display: flex; gap: 16px; font-size: 14px; color: #1e3287; }
.wstabs { display: flex; gap: 2px; flex-wrap: wrap; }
.wstabs a { padding: 5px 12px; border-radius: 3px; color: #1e2a3a; text-decoration: none; border: 1px solid transparent; }
.wstabs a:hover { border-color: #7da2ce; background: linear-gradient(180deg, #fafbfd, #ebf3fd); }
.wstabs a.on { border-color: #7da2ce; background: linear-gradient(180deg, #e5f1fb, #c7e0f7); }
.sheet { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin: 8px 0; border: 1px solid #cdd8e6; border-radius: 4px; background: linear-gradient(180deg, #fff, #f2f7fd); }
.sheet.is-done { background: linear-gradient(180deg, #fbfffa, #eef8ea); border-color: #b9dcb0; }
.sheet .ic { font-size: 34px; width: 46px; text-align: center; }
.sheet b { font-size: 17px; color: #1e3287; font-weight: normal; }
.sheet .done { color: #2b7a2b; font-weight: 600; white-space: nowrap; }
.sheet .aero { text-decoration: none; white-space: nowrap; }
.lvbar { height: 7px; border-radius: 4px; background: #e2e8f0; margin-top: 6px; max-width: 260px; overflow: hidden; border: 1px solid #c5d1e0; }
.lvbar i { display: block; height: 100%; background: linear-gradient(180deg, #c9f7b9, #4bc93a 50%, #2fae20 51%, #5ad848); }
.next { margin: 4px 0; padding-left: 20px; color: #4a5a70; }
a.aero { text-decoration: none; display: inline-block; color: #1e2a3a; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daycol { border: 1px solid #cdd8e6; border-radius: 4px; min-height: 150px; padding: 6px; background: #fbfcfe; }
.daycol.today { border-color: #3c7fb1; box-shadow: inset 0 0 0 1px #48d6fd; background: #f2f9ff; }
.dayname { font-weight: 600; color: #1e3287; text-align: center; margin-bottom: 6px; }
